name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual "Run workflow" button on any branch

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm reads the version from git tags during install.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Deliberately unconstrained: this matrix resolves dependencies freshly
      # every run, which is what catches upstream releases that break us. The
      # `pinned` job below covers the opposite need.
      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=DicomRTTool --cov-report=xml --cov-report=term-missing

      # Record exactly what this cell resolved to. Uploaded even on failure,
      # because a red run's environment is the one you most want to inspect.
      - name: Record resolved environment
        if: always()
        run: python -m pip freeze --exclude-editable > environment-${{ matrix.os }}-py${{ matrix.python-version }}.txt

      - name: Upload environment record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: environment-${{ matrix.os }}-py${{ matrix.python-version }}
          path: environment-${{ matrix.os }}-py${{ matrix.python-version }}.txt

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  minimum-versions:
    name: Lowest declared dependency versions (3.10)
    runs-on: ubuntu-latest
    # Proves the lower bounds in pyproject.toml are real. Without this, a floor
    # is just an assertion nobody executes: the resolver always picks the newest
    # release, so a too-low floor stays invisible until it breaks an installing
    # user who happens to have older pins.

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          # The minimum supported interpreter, so the floors are exercised on
          # the oldest environment we claim to support.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Derived from the installed metadata rather than a second hand-kept list,
      # so editing a bound in pyproject.toml automatically changes what is
      # tested here and the two cannot drift apart.
      - name: Derive floors from package metadata
        run: |
          python - <<'PY' > floors.txt
          from importlib.metadata import requires
          from packaging.requirements import Requirement

          for raw in requires("DicomRTTool"):
              req = Requirement(raw)
              if req.marker is not None:  # optional extra, not a runtime dep
                  continue
              mins = [s.version for s in req.specifier if s.operator == ">="]
              if not mins:
                  raise SystemExit(f"{req.name} has no lower bound; add one to pyproject.toml")
              print(f"{req.name}=={mins[0]}.*")
          PY
          cat floors.txt

      - name: Downgrade direct dependencies to their floors
        run: pip install --upgrade --force-reinstall -r floors.txt

      - name: Show installed floors
        run: pip list

      - name: Run tests
        run: pytest

      - name: Record resolved environment
        if: always()
        run: python -m pip freeze --exclude-editable > environment-minimum-versions.txt

      - name: Upload environment record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: environment-minimum-versions
          path: |
            environment-minimum-versions.txt
            floors.txt

  pinned:
    name: Pinned constraints reproduction (3.12)
    runs-on: ubuntu-latest
    # The other half of the reproducibility record: installs the exact versions
    # committed in constraints/, so the recorded environment is proven to still
    # resolve and still pass rather than being a file nobody executes.

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci-linux-py3.12.txt

      - name: Install against committed constraints
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints/ci-linux-py3.12.txt

      - name: Run tests
        run: pytest

      # Diffed against the committed file so drift is visible in the log: the
      # constraints stay honest without failing the build on a benign
      # platform-conditional package that simply was not installed here.
      # Both sides are PEP 503-normalised first (lowercase, "_" -> "-"), so the
      # only differences shown are real ones rather than spelling of a name.
      - name: Record resolved environment
        if: always()
        run: |
          python -m pip freeze --exclude-editable > environment-pinned.txt
          normalise() { grep -vE '^\s*(#|$)' "$1" | tr 'A-Z' 'a-z' | tr '_' '-' | sort; }
          echo "::group::Resolved vs committed constraints"
          diff <(normalise constraints/ci-linux-py3.12.txt) \
               <(normalise environment-pinned.txt) && \
            echo "environment matches the committed constraints exactly" || \
            echo "note: '<' = pinned but not installed here, '>' = installed but unpinned; informational, not a failure"
          echo "::endgroup::"

      - name: Upload environment record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: environment-pinned
          path: environment-pinned.txt
