name: Conformance

# Runs the RTMaskConformanceTest analytical accuracy gate against
# DicomRTTool's RTSTRUCT->mask conversion. The fixture (synthetic CT +
# RTSTRUCT + analytic per-ROI ground-truth NIfTIs) is generated at the
# start of the job, so this workflow has no committed test data.
#
# This is intentionally a separate job (not part of `Tests`) so the
# Conformance status appears as its own check on PRs — accuracy
# regressions are easy to spot and easy to gate independently of the
# existing unit tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual "Run workflow" button on any branch

jobs:
  conformance:
    name: RTSTRUCT->mask conformance
    runs-on: ubuntu-latest
    # Conformance is an accuracy property; the matrix coverage in
    # test.yml already exercises Python/OS portability. Pick the most
    # commonly-deployed combo to keep CI minutes reasonable.
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm reads the version from git tags during install.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-conformance.txt
            constraints/ci-linux-py3.12.txt

      # The suite itself is pinned to a commit SHA in requirements-conformance.txt
      # and everything from PyPI is pinned by the constraints file, so a verdict
      # from this job is attributable to a specific, recorded environment.
      - name: Install package + conformance suite
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r requirements-conformance.txt -c constraints/ci-linux-py3.12.txt

      - name: Record pinned conformance revision
        run: pip show rtmask-conformance

      - name: Run conformance suite
        run: pytest tests/test_conformance.py -v

      - name: Record resolved environment
        if: always()
        run: python -m pip freeze --exclude-editable > environment-conformance.txt

      - name: Upload environment record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: environment-conformance
          path: environment-conformance.txt
